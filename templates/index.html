<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .form-container {
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #555;
        }

        .error {
            min-height: 20px;
            margin-top: 6px;
            color: #d93025;
            font-size: 13px;
        }

        .button-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #222;
            color: white;
        }

        .btn-primary:hover {
            background: #444;
        }

        .btn-secondary {
            background: #ddd;
            color: #222;
        }

        .btn-secondary:hover {
            background: #c8c8c8;
        }

        .btn-edit {
            background: #555;
            color: white;
            padding: 7px 13px;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background: #333;
        }

        .btn-delete {
            background: #d93025;
            color: white;
            padding: 7px 13px;
        }

        .btn-delete:hover {
            background: #b71c1c;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* Delete Modal */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #222;
        }

        .modal p {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            background: #ddd;
            color: #222;
        }

        .btn-cancel:hover {
            background: #c8c8c8;
        }

        .btn-confirm-delete {
            background: #d93025;
            color: white;
        }

        .btn-confirm-delete:hover {
            background: #b71c1c;
        }

        @media (max-width: 768px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .button-container {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Customer Management</h1>

    <!-- Message -->

    <div id="message" class="message"></div>


    <!-- Customer Form -->

    <div class="form-container">

        <form id="customerForm" novalidate>

            <div class="form-row">

                <!-- Customer Name -->

                <div class="form-group">

                    <label for="customer_name">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        autocomplete="off"
                    >

                    <div
                        id="nameError"
                        class="error"
                    ></div>

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                    <div
                        id="genderError"
                        class="error"
                    ></div>

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="text"
                        id="amount"
                        name="amount"
                        inputmode="decimal"
                        autocomplete="off"
                    >

                    <div
                        id="amountError"
                        class="error"
                    ></div>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-container">

                <button
                    type="submit"
                    class="btn-primary"
                    id="submitButton"
                >
                    Add Customer
                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    id="cancelButton"
                    style="display: none;"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>


    <!-- Customer Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Customer Name</th>
                    <th>Gender</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="customerTableBody"></tbody>

        </table>


        <div
            id="emptyMessage"
            class="empty-message"
            style="display: none;"
        >
            No customers found.
        </div>

    </div>

</div>


<!-- Delete Confirmation Modal -->

<div
    id="deleteModal"
    class="modal-overlay"
>

    <div class="modal">

        <h2>
            Delete Customer
        </h2>

        <p>
            Are you sure you want to delete this customer?
        </p>

        <div class="modal-buttons">

            <button
                type="button"
                class="btn-cancel"
                id="cancelDelete"
            >
                Cancel
            </button>

            <button
                type="button"
                class="btn-confirm-delete"
                id="confirmDelete"
            >
                Delete
            </button>

        </div>

    </div>

</div>


<script>

    let editingId = null;
    let deleteId = null;


    // --------------------------------
    // Get Elements
    // --------------------------------

    const customerForm =
        document.getElementById("customerForm");

    const customerNameInput =
        document.getElementById("customer_name");

    const genderInput =
        document.getElementById("gender");

    const amountInput =
        document.getElementById("amount");

    const nameError =
        document.getElementById("nameError");

    const genderError =
        document.getElementById("genderError");

    const amountError =
        document.getElementById("amountError");

    const submitButton =
        document.getElementById("submitButton");

    const cancelButton =
        document.getElementById("cancelButton");

    const customerTableBody =
        document.getElementById("customerTableBody");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const message =
        document.getElementById("message");

    const deleteModal =
        document.getElementById("deleteModal");

    const cancelDelete =
        document.getElementById("cancelDelete");

    const confirmDelete =
        document.getElementById("confirmDelete");


    // --------------------------------
    // Customer Name Input Filter
    // --------------------------------
    // Only letters, spaces, periods,
    // hyphens and apostrophes are allowed.

    customerNameInput.addEventListener(
        "input",
        function () {

            this.value = this.value.replace(
                /[^A-Za-z .'-]/g,
                ""
            );

        }
    );


    // --------------------------------
    // Amount Input Filter
    // --------------------------------
    // Only numbers and one decimal point
    // are allowed.
    //
    // Maximum 2 digits after decimal.

    amountInput.addEventListener(
        "input",
        function () {

            let value = this.value;


            // Remove everything except
            // numbers and decimal point.

            value = value.replace(
                /[^0-9.]/g,
                ""
            );


            // Keep only the first decimal point.

            const firstDot =
                value.indexOf(".");


            if (firstDot !== -1) {

                value =
                    value.substring(
                        0,
                        firstDot + 1
                    )
                    +
                    value
                        .substring(firstDot + 1)
                        .replace(/\./g, "");

            }


            // Limit to 2 decimal places.

            if (value.includes(".")) {

                const parts =
                    value.split(".");

                value =
                    parts[0]
                    +
                    "."
                    +
                    parts[1].substring(0, 2);

            }


            this.value = value;

        }
    );


    // --------------------------------
    // Show Message
    // --------------------------------

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";


        setTimeout(() => {

            message.style.display =
                "none";

        }, 3000);

    }


    // --------------------------------
    // Clear Errors
    // --------------------------------

    function clearErrors() {

        nameError.textContent = "";
        genderError.textContent = "";
        amountError.textContent = "";

    }


    // --------------------------------
    // Validate Name
    // --------------------------------

    function validateName(name) {

        name = name.trim();


        if (!name) {

            return "Please enter a customer name.";

        }


        if (name.length > 100) {

            return "Please enter a valid customer name.";

        }


        const namePattern =
            /^[A-Za-z]+(?:[ .'-]+[A-Za-z]+)*\.?$/;


        if (!namePattern.test(name)) {

            return "Please enter a valid customer name.";

        }


        return "";

    }


    // --------------------------------
    // Validate Gender
    // --------------------------------

    function validateGender(gender) {

        if (!gender) {

            return "Please select a gender.";

        }


        const allowedGenders = [
            "Male",
            "Female",
            "Other"
        ];


        if (!allowedGenders.includes(gender)) {

            return "Please select a valid gender.";

        }


        return "";

    }


    // --------------------------------
    // Validate Amount
    // --------------------------------

    function validateAmount(amount) {

        amount = amount.trim();


        if (!amount) {

            return "Please enter an amount.";

        }


        const amountPattern =
            /^\d+(\.\d{1,2})?$/;


        if (!amountPattern.test(amount)) {

            return "Please enter a valid amount.";

        }


        const numericAmount =
            Number(amount);


        if (!Number.isFinite(numericAmount)) {

            return "Please enter a valid amount.";

        }


        if (numericAmount <= 0) {

            return "Please enter a valid amount.";

        }


        if (numericAmount > 99999999.99) {

            return "Please enter a valid amount.";

        }


        return "";

    }


    // --------------------------------
    // Validate Form
    // --------------------------------

    function validateForm() {

        clearErrors();


        const name =
            customerNameInput.value;

        const gender =
            genderInput.value;

        const amount =
            amountInput.value;


        const nameValidation =
            validateName(name);

        const genderValidation =
            validateGender(gender);

        const amountValidation =
            validateAmount(amount);


        let valid = true;


        if (nameValidation) {

            nameError.textContent =
                nameValidation;

            valid = false;

        }


        if (genderValidation) {

            genderError.textContent =
                genderValidation;

            valid = false;

        }


        if (amountValidation) {

            amountError.textContent =
                amountValidation;

            valid = false;

        }


        return valid;

    }


    // --------------------------------
    // Load Customers
    // --------------------------------

    async function loadCustomers() {

        try {

            const response =
                await fetch("/api/customers");


            const customers =
                await response.json();


            customerTableBody.innerHTML =
                "";


            if (customers.length === 0) {

                emptyMessage.style.display =
                    "block";

                return;

            }


            emptyMessage.style.display =
                "none";


            customers.forEach(customer => {

                const row =
                    document.createElement("tr");


                const idCell =
                    document.createElement("td");

                idCell.textContent =
                    customer.customer_id;


                const nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    customer.customer_name;


                const genderCell =
                    document.createElement("td");

                genderCell.textContent =
                    customer.gender;


                const amountCell =
                    document.createElement("td");

                amountCell.textContent =
                    Number(
                        customer.amount
                    ).toFixed(2);


                const actionCell =
                    document.createElement("td");


                // Edit Button

                const editButton =
                    document.createElement("button");

                editButton.textContent =
                    "Edit";

                editButton.className =
                    "btn-edit";

                editButton.type =
                    "button";


                editButton.addEventListener(
                    "click",
                    () =>
                        editCustomer(
                            customer.customer_id
                        )
                );


                // Delete Button

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "Delete";

                deleteButton.className =
                    "btn-delete";

                deleteButton.type =
                    "button";


                deleteButton.addEventListener(
                    "click",
                    () =>
                        openDeleteModal(
                            customer.customer_id
                        )
                );


                actionCell.appendChild(
                    editButton
                );

                actionCell.appendChild(
                    deleteButton
                );


                row.appendChild(idCell);
                row.appendChild(nameCell);
                row.appendChild(genderCell);
                row.appendChild(amountCell);
                row.appendChild(actionCell);


                customerTableBody.appendChild(
                    row
                );

            });


        } catch (error) {

            showMessage(
                "Unable to load customers.",
                "error-message"
            );

        }

    }


    // --------------------------------
    // Add / Update Customer
    // --------------------------------

    customerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            if (!validateForm()) {

                return;

            }


            const customerData = {

                customer_name:
                    customerNameInput.value.trim(),

                gender:
                    genderInput.value,

                amount:
                    amountInput.value.trim()

            };


            try {

                let response;


                // CREATE

                if (editingId === null) {

                    response =
                        await fetch(
                            "/api/customers",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        customerData
                                    )
                            }
                        );

                }


                // UPDATE

                else {

                    response =
                        await fetch(
                            `/api/customers/${editingId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        customerData
                                    )
                            }
                        );

                }


                const result =
                    await response.json();


                if (!response.ok) {

                    showMessage(
                        result.error ||
                        "Something went wrong.",
                        "error-message"
                    );

                    return;

                }


                if (editingId === null) {

                    showMessage(
                        "Customer added successfully.",
                        "success"
                    );

                }

                else {

                    showMessage(
                        "Customer updated successfully.",
                        "success"
                    );

                }


                resetForm();

                await loadCustomers();


            } catch (error) {

                showMessage(
                    "Unable to connect to the server.",
                    "error-message"
                );

            }

        }
    );


    // --------------------------------
    // Edit Customer
    // --------------------------------

    async function editCustomer(id) {

        try {

            const response =
                await fetch(
                    `/api/customers/${id}`
                );


            const customer =
                await response.json();


            if (!response.ok) {

                showMessage(
                    customer.error ||
                    "Unable to load customer.",
                    "error-message"
                );

                return;

            }


            customerNameInput.value =
                customer.customer_name;

            genderInput.value =
                customer.gender;

            amountInput.value =
                Number(
                    customer.amount
                ).toFixed(2);


            editingId = id;


            submitButton.textContent =
                "Update Customer";


            cancelButton.style.display =
                "inline-block";


            clearErrors();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            showMessage(
                "Unable to load customer.",
                "error-message"
            );

        }

    }


    // --------------------------------
    // Cancel Edit
    // --------------------------------

    cancelButton.addEventListener(
        "click",
        function () {

            resetForm();

        }
    );


    // --------------------------------
    // Reset Form
    // --------------------------------

    function resetForm() {

        customerForm.reset();

        editingId = null;


        submitButton.textContent =
            "Add Customer";


        cancelButton.style.display =
            "none";


        clearErrors();

    }


    // --------------------------------
    // Open Delete Modal
    // --------------------------------

    function openDeleteModal(id) {

        deleteId = id;

        deleteModal.style.display =
            "flex";

    }


    // --------------------------------
    // Close Delete Modal
    // --------------------------------

    function closeDeleteModal() {

        deleteId = null;

        deleteModal.style.display =
            "none";

    }


    // --------------------------------
    // Cancel Delete
    // --------------------------------

    cancelDelete.addEventListener(
        "click",
        function () {

            closeDeleteModal();

        }
    );


    // --------------------------------
    // Confirm Delete
    // --------------------------------

    confirmDelete.addEventListener(
        "click",
        async function () {

            if (deleteId === null) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/customers/${deleteId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    showMessage(
                        result.error ||
                        "Unable to delete customer.",
                        "error-message"
                    );


                    closeDeleteModal();

                    return;

                }


                closeDeleteModal();


                showMessage(
                    "Customer deleted successfully.",
                    "success"
                );


                await loadCustomers();


            } catch (error) {

                closeDeleteModal();


                showMessage(
                    "Unable to connect to the server.",
                    "error-message"
                );

            }

        }
    );


    // --------------------------------
    // Close Modal Outside Click
    // --------------------------------

    deleteModal.addEventListener(
        "click",
        function (event) {

            if (event.target === deleteModal) {

                closeDeleteModal();

            }

        }
    );


    // --------------------------------
    // Load Data
    // --------------------------------

    loadCustomers();

</script>

</body>
</html>
