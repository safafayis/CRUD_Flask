<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CRUD Nesto</title>


    <style>

        /* ==============================
           GLOBAL
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f8;
            min-height: 100vh;
        }


        /* ==============================
           TOP BAR
        ============================== */

        .topbar {
            background: white;
            padding: 16px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);
        }


        .topbar h1 {
            font-size: 21px;
            color: #222;
        }


        .user-area {
            display: flex;
            align-items: center;
        }


        .logout-btn {
            background: #222;
            color: white;

            border: none;
            border-radius: 7px;

            padding: 9px 17px;

            cursor: pointer;
            font-size: 14px;
        }


        .logout-btn:hover {
            background: #333;
        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }


        /* ==============================
           CARD
        ============================== */

        .card {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.06);
        }


        .card h2 {
            margin-bottom: 20px;
            color: #222;
            font-size: 20px;
        }


        /* ==============================
           FORM
        ============================== */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            align-items: end;
        }


        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;

            color: #333;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 11px;

            border:
                1px solid #d5d9dd;

            border-radius: 7px;

            outline: none;

            font-size: 14px;

            background: white;
        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #555;
        }


        /* ==============================
           FORM BUTTONS
        ============================== */

        .form-actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }


        .btn {

            padding: 11px 18px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }


        .primary-btn {

            background: #222;

            color: white;
        }


        .primary-btn:hover {

            background: #333;
        }


        .secondary-btn {

            background: #eee;

            color: #333;
        }


        .secondary-btn:hover {

            background: #ddd;
        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            display: none;

            padding: 10px 12px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;
        }


        .message.success {

            display: block;

            background: #effaf0;

            color: #2e7d32;

            border:
                1px solid #c8e6c9;
        }


        .message.error {

            display: block;

            background: #fff1f1;

            color: #c62828;

            border:
                1px solid #ffcaca;
        }


        /* ==============================
           TABLE CARD
        ============================== */

        .table-card {

            margin-top: 25px;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 700px;
        }


        th,
        td {

            padding: 13px;

            border-bottom:
                1px solid #eee;

            text-align: left;

            font-size: 14px;
        }


        th {

            background: #f8f9fa;

            font-weight: 600;

            color: #333;
        }


        td {

            color: #444;
        }


        /* ==============================
           ACTION BUTTONS
        ============================== */

        .action-btn {

            padding: 7px 11px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 5px;

            font-size: 13px;
        }


        .edit-btn {

            background: #e9eefc;

            color: #2851a3;
        }


        .edit-btn:hover {

            background: #dce5fa;
        }


        .delete-btn {

            background: #fdeaea;

            color: #c62828;
        }


        .delete-btn:hover {

            background: #fbdada;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.45);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;
        }


        .modal-overlay.active {

            display: flex;
        }


        .modal {

            width: 90%;

            max-width: 400px;

            background: white;

            border-radius: 12px;

            padding: 25px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.2);
        }


        .modal h3 {

            margin-bottom: 10px;

            color: #222;
        }


        .modal p {

            color: #666;

            font-size: 14px;

            line-height: 1.5;
        }


        .modal-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }


        .modal-actions button {

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }


        .cancel-btn {

            background: white;

            border:
                1px solid #ccc;

            color: #333;
        }


        .cancel-btn:hover {

            background: #f5f5f5;
        }


        .confirm-btn {

            background: #c62828;

            color: white;

            border: none;
        }


        .confirm-btn:hover {

            background: #b71c1c;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 800px) {

            .form-grid {

                grid-template-columns: 1fr;
            }


            .topbar {

                padding: 15px 20px;
            }


            .topbar h1 {

                font-size: 18px;
            }


            .container {

                margin-top: 20px;
            }


            .card {

                padding: 20px;
            }

        }


        @media (max-width: 500px) {

            .topbar {

                padding: 14px 15px;
            }


            .topbar h1 {

                font-size: 17px;
            }


            .logout-btn {

                padding: 8px 13px;
            }


            .form-actions {

                flex-direction: column;
            }


            .form-actions .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <div class="topbar">

        <h1>
            CRUD Nesto
        </h1>


        <div class="user-area">

            <!-- Email removed -->

            <button
                class="logout-btn"
                id="logoutBtn">

                Logout

            </button>

        </div>

    </div>



    <!-- =========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="container">


        <!-- =====================================
             CUSTOMER FORM
        ====================================== -->

        <div class="card">

            <h2 id="formTitle">
                Add Customer
            </h2>


            <div
                id="pageMessage"
                class="message">
            </div>


            <form
                id="customerForm"
                novalidate>


                <div class="form-grid">


                    <!-- CUSTOMER NAME -->

                    <div class="form-group">

                        <label for="customerName">
                            Customer Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            autocomplete="off">

                    </div>


                    <!-- GENDER -->

                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- AMOUNT -->

                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="text"
                            id="amount"
                            inputmode="decimal"
                            autocomplete="off">

                    </div>


                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn primary-btn"
                        id="submitBtn">

                        Add Customer

                    </button>


                    <button
                        type="button"
                        class="btn secondary-btn"
                        id="cancelEditBtn"
                        style="display: none;">

                        Cancel

                    </button>

                </div>


            </form>

        </div>



        <!-- =====================================
             CUSTOMER TABLE
        ====================================== -->

        <div class="card table-card">

            <h2>
                Customer Records
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Customer Name
                        </th>

                        <th>
                            Gender
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="customerTableBody">

                </tbody>

            </table>

        </div>

    </div>



    <!-- =========================================
         DELETE MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="deleteModal">


        <div class="modal">

            <h3>
                Delete Customer
            </h3>


            <p>

                Are you sure you want to delete
                this customer?

                <br><br>

                This action cannot be undone.

            </p>


            <div class="modal-actions">

                <button
                    class="cancel-btn"
                    id="cancelDeleteBtn">

                    Cancel

                </button>


                <button
                    class="confirm-btn"
                    id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         LOGOUT MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="logoutModal">


        <div class="modal">

            <h3>
                Logout
            </h3>


            <p>
                Are you sure you want to logout?
            </p>


            <div class="modal-actions">

                <button
                    class="cancel-btn"
                    id="cancelLogoutBtn">

                    Cancel

                </button>


                <button
                    class="confirm-btn"
                    id="confirmLogoutBtn">

                    Logout

                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ========================================
           VARIABLES
        ======================================== */

        let editingCustomerId = null;

        let deletingCustomerId = null;



        /* ========================================
           ELEMENTS
        ======================================== */

        const customerForm =
            document.getElementById(
                "customerForm"
            );


        const customerNameInput =
            document.getElementById(
                "customerName"
            );


        const genderInput =
            document.getElementById(
                "gender"
            );


        const amountInput =
            document.getElementById(
                "amount"
            );


        const tableBody =
            document.getElementById(
                "customerTableBody"
            );


        const pageMessage =
            document.getElementById(
                "pageMessage"
            );



        /* ========================================
           CUSTOMER NAME FILTER
        ======================================== */

        customerNameInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /[^A-Za-z .'-]/g,
                        ""
                    );

            }
        );



        /* ========================================
           AMOUNT FILTER
        ======================================== */

        amountInput.addEventListener(
            "input",
            function () {

                let value =
                    this.value;


                /*
                 * Allow only numbers
                 * and decimal point
                 */

                value =
                    value.replace(
                        /[^0-9.]/g,
                        ""
                    );


                /*
                 * Allow only one decimal point
                 */

                const firstDot =
                    value.indexOf(".");


                if (firstDot !== -1) {

                    value =
                        value.substring(
                            0,
                            firstDot + 1
                        )
                        +
                        value
                            .substring(
                                firstDot + 1
                            )
                            .replace(
                                /\./g,
                                ""
                            );

                }


                /*
                 * Maximum 2 decimal places
                 */

                if (value.includes(".")) {

                    const parts =
                        value.split(".");


                    value =
                        parts[0]
                        +
                        "."
                        +
                        parts[1]
                            .substring(
                                0,
                                2
                            );

                }


                this.value =
                    value;

            }
        );



        /* ========================================
           SHOW MESSAGE
        ======================================== */

        function showMessage(
            text,
            type
        ) {

            pageMessage.textContent =
                text;


            pageMessage.className =
                "message " + type;

        }



        /* ========================================
           LOAD CUSTOMERS
        ======================================== */

        async function loadCustomers() {

            try {

                const response =
                    await fetch(
                        "/api/customers"
                    );


                /*
                 * User session expired
                 */

                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login";

                    return;

                }


                const customers =
                    await response.json();


                tableBody.innerHTML =
                    "";


                /*
                 * No records
                 */

                if (
                    customers.length === 0
                ) {

                    tableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                style="
                                    text-align:center;
                                    color:#777;
                                    padding:25px;
                                ">

                                No customer records found.

                            </td>

                        </tr>

                    `;

                    return;

                }


                /*
                 * Display records
                 */

                customers.forEach(
                    function (customer) {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        row.innerHTML = `

                            <td>
                                ${customer.customer_id}
                            </td>


                            <td>
                                ${customer.customer_name}
                            </td>


                            <td>
                                ${customer.gender}
                            </td>


                            <td>
                                ${Number(
                                    customer.amount
                                ).toFixed(2)}
                            </td>


                            <td>

                                <button
                                    class="action-btn edit-btn"
                                    onclick="
                                        editCustomer(
                                            ${customer.customer_id}
                                        )
                                    ">

                                    Edit

                                </button>


                                <button
                                    class="action-btn delete-btn"
                                    onclick="
                                        openDeleteModal(
                                            ${customer.customer_id}
                                        )
                                    ">

                                    Delete

                                </button>

                            </td>

                        `;


                        tableBody.appendChild(
                            row
                        );

                    }
                );

            }

            catch (error) {

                showMessage(
                    "Unable to load customer records.",
                    "error"
                );

            }

        }



        /* ========================================
           ADD / UPDATE CUSTOMER
        ======================================== */

        customerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const customerName =
                    customerNameInput
                        .value
                        .trim();


                const gender =
                    genderInput.value;


                const amount =
                    amountInput
                        .value
                        .trim();


                /*
                 * Name required
                 */

                if (!customerName) {

                    showMessage(
                        "Please enter a customer name.",
                        "error"
                    );

                    return;

                }


                /*
                 * Gender required
                 */

                if (!gender) {

                    showMessage(
                        "Please select a gender.",
                        "error"
                    );

                    return;

                }


                /*
                 * Amount required
                 */

                if (!amount) {

                    showMessage(
                        "Please enter an amount.",
                        "error"
                    );

                    return;

                }


                /*
                 * Determine API
                 */

                const url =
                    editingCustomerId
                        ? `/api/customers/${editingCustomerId}`
                        : "/api/customers";


                const method =
                    editingCustomerId
                        ? "PUT"
                        : "POST";


                try {

                    const response =
                        await fetch(
                            url,
                            {

                                method: method,

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        customer_name:
                                            customerName,

                                        gender:
                                            gender,

                                        amount:
                                            amount

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    /*
                     * API error
                     */

                    if (!response.ok) {

                        showMessage(
                            data.error ||
                                "Unable to save customer.",
                            "error"
                        );

                        return;

                    }


                    /*
                     * Success
                     */

                    showMessage(
                        data.message,
                        "success"
                    );


                    resetForm();


                    loadCustomers();

                }

                catch (error) {

                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }

            }
        );



        /* ========================================
           EDIT CUSTOMER
        ======================================== */

        async function editCustomer(
            customerId
        ) {

            try {

                const response =
                    await fetch(
                        `/api/customers/${customerId}`
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login";

                    return;

                }


                const customer =
                    await response.json();


                /*
                 * Fill form
                 */

                customerNameInput.value =
                    customer.customer_name;


                genderInput.value =
                    customer.gender;


                amountInput.value =
                    Number(
                        customer.amount
                    ).toFixed(2);


                /*
                 * Set editing mode
                 */

                editingCustomerId =
                    customerId;


                document.getElementById(
                    "formTitle"
                ).textContent =
                    "Edit Customer";


                document.getElementById(
                    "submitBtn"
                ).textContent =
                    "Update Customer";


                document.getElementById(
                    "cancelEditBtn"
                ).style.display =
                    "inline-block";


                /*
                 * Scroll to form
                 */

                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            }

            catch (error) {

                showMessage(
                    "Unable to load customer.",
                    "error"
                );

            }

        }



        /* ========================================
           RESET FORM
        ======================================== */

        function resetForm() {

            customerForm.reset();


            editingCustomerId =
                null;


            document.getElementById(
                "formTitle"
            ).textContent =
                "Add Customer";


            document.getElementById(
                "submitBtn"
            ).textContent =
                "Add Customer";


            document.getElementById(
                "cancelEditBtn"
            ).style.display =
                "none";

        }



        /* ========================================
           CANCEL EDIT
        ======================================== */

        document.getElementById(
            "cancelEditBtn"
        ).addEventListener(
            "click",
            function () {

                resetForm();

            }
        );



        /* ========================================
           DELETE MODAL
        ======================================== */

        const deleteModal =
            document.getElementById(
                "deleteModal"
            );



        function openDeleteModal(
            customerId
        ) {

            deletingCustomerId =
                customerId;


            deleteModal.classList.add(
                "active"
            );

        }



        /* ========================================
           CANCEL DELETE
        ======================================== */

        document.getElementById(
            "cancelDeleteBtn"
        ).addEventListener(
            "click",
            function () {

                deleteModal.classList.remove(
                    "active"
                );


                deletingCustomerId =
                    null;

            }
        );



        /* ========================================
           CONFIRM DELETE
        ======================================== */

        document.getElementById(
            "confirmDeleteBtn"
        ).addEventListener(
            "click",
            async function () {

                if (
                    !deletingCustomerId
                ) {

                    return;

                }


                try {

                    const response =
                        await fetch(
                            `/api/customers/${deletingCustomerId}`,
                            {

                                method:
                                    "DELETE"

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.error ||
                                "Unable to delete customer.",
                            "error"
                        );

                        return;

                    }


                    /*
                     * Close modal
                     */

                    deleteModal.classList.remove(
                        "active"
                    );


                    deletingCustomerId =
                        null;


                    /*
                     * Show success
                     */

                    showMessage(
                        data.message,
                        "success"
                    );


                    /*
                     * Reload table
                     */

                    loadCustomers();

                }

                catch (error) {

                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }

            }
        );



        /* ========================================
           LOGOUT MODAL
        ======================================== */

        const logoutModal =
            document.getElementById(
                "logoutModal"
            );



        /* ========================================
           OPEN LOGOUT MODAL
        ======================================== */

        document.getElementById(
            "logoutBtn"
        ).addEventListener(
            "click",
            function () {

                logoutModal.classList.add(
                    "active"
                );

            }
        );



        /* ========================================
           CANCEL LOGOUT
        ======================================== */

        document.getElementById(
            "cancelLogoutBtn"
        ).addEventListener(
            "click",
            function () {

                logoutModal.classList.remove(
                    "active"
                );

            }
        );



        /* ========================================
           CONFIRM LOGOUT
        ======================================== */

        document.getElementById(
            "confirmLogoutBtn"
        ).addEventListener(
            "click",
            async function () {

                try {

                    const response =
                        await fetch(
                            "/api/logout",
                            {

                                method:
                                    "POST"

                            }
                        );


                    if (
                        response.ok
                    ) {

                        window.location.href =
                            "/login";

                    }

                }

                catch (error) {

                    showMessage(
                        "Unable to logout. Please try again.",
                        "error"
                    );

                }

            }
        );



        /* ========================================
           CLOSE MODALS WHEN CLICKING OUTSIDE
        ======================================== */

        deleteModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    deleteModal
                ) {

                    deleteModal.classList.remove(
                        "active"
                    );

                    deletingCustomerId =
                        null;

                }

            }
        );


        logoutModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    logoutModal
                ) {

                    logoutModal.classList.remove(
                        "active"
                    );

                }

            }
        );



        /* ========================================
           INITIAL LOAD
        ======================================== */

        loadCustomers();

    </script>

</body>

</html>
